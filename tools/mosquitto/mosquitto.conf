# Cấu hình Mosquitto 2.x cho dự án IoT giao thông.
# Chạy từ THƯ MỤC GỐC dự án (D:\Ki1_4\IOT\BTL):
#   & "C:\Program Files\mosquitto\mosquitto.exe" -c tools\mosquitto\mosquitto.conf -v

# Lắng nghe trên mọi địa chỉ mạng của laptop, cổng 1883 (mặc định Mosquitto 2.x chỉ nghe localhost).
listener 1883

# Bắt buộc đăng nhập: tránh người khác cùng mạng Wi-Fi gửi trạng thái đèn giả.
allow_anonymous false
# File tài khoản tạo bằng mosquitto_passwd (đã nằm trong .gitignore). Đường dẫn tính từ thư mục chạy lệnh.
password_file tools/mosquitto/passwd
